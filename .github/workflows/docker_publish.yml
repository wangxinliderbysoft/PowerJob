name: build_docker

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build_docker:
    name: Build docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Maven Project
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install mvnd 1.0.3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mvnd.tar.gz" https://archive.apache.org/dist/maven/mvnd/1.0.3/maven-mvnd-1.0.3-linux-amd64.tar.gz
          echo "9c9933db7552869c1c4d45d9eaff34291599273929c010086e07dc78b090d7b393467a94fd1d9cc96201856b71723f2501a6ac94907248021f83eb277651cf26  $RUNNER_TEMP/mvnd.tar.gz" | sha512sum --check -
          tar -xzf "$RUNNER_TEMP/mvnd.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maven-mvnd-1.0.3-linux-amd64/bin" >> "$GITHUB_PATH"
      - name: Verify and package
        run: bash .github/scripts/verify-java21.sh && /bin/cp -rf powerjob-server/powerjob-server-starter/target/*.jar powerjob-server/docker/powerjob-server.jar && /bin/cp -rf powerjob-worker-agent/target/*.jar powerjob-worker-agent/powerjob-agent.jar

      # Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build And Push [powerjob-server]
        uses: docker/build-push-action@v6
        with:
          context: powerjob-server/docker/
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            tjqq/powerjob-server:latest
            powerjob/powerjob-server:latest
            tjqq/powerjob-server:${{ github.ref_name }}
            powerjob/powerjob-server:${{ github.ref_name }}

      - name: Build And Push [powerjob-agent]
        uses: docker/build-push-action@v6
        with:
          context: powerjob-worker-agent/
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            tjqq/powerjob-agent:latest
            powerjob/powerjob-agent:latest
            tjqq/powerjob-agent:${{ github.ref_name }}
            powerjob/powerjob-agent:${{ github.ref_name }}

      - name: Build And Push [powerjob-worker-samples]
        uses: docker/build-push-action@v6
        with:
          context: powerjob-worker-samples/
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            tjqq/powerjob-worker-samples:latest
            powerjob/powerjob-worker-samples:latest
            tjqq/powerjob-worker-samples:${{ github.ref_name }}
            powerjob/powerjob-worker-samples:${{ github.ref_name }}
